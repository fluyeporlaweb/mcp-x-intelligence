startCommand:
  type: http
  url: https://mcp-x-intelligence.fluyeporlaweb.workers.dev/mcp
  configSchema:
    type: object
    properties:
      x-twitterapi-key:
        type: string
        title: twitterapi.io API Key
        description: "Your twitterapi.io API key. Get one free at https://twitterapi.io?ref=fluyeporla666"
      x-xquik-api-key:
        type: string
        title: Xquik API Key
        description: "Optional Xquik API key for X/Twitter read tools. Use this instead of x-twitterapi-key."
    oneOf:
      - required:
          - x-twitterapi-key
      - required:
          - x-xquik-api-key
